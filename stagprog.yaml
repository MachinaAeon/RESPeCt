name: STAGPROG.BIN
sha1: 7182a396619f7c3ee04aad6876bf47a3f1267f0e
options:
  basename: stagprog
  target_path: disc/STAGPROG.BIN
  elf_path: build/stagprog.elf
  base_path: .
  platform: psx
  compiler: PSYQ
  # Overlays reach KERNEL's globals through its $gp. Without this the
  # linker invents a GOT and the output grows by 8 bytes.
  gp_value: 0x80062D1C
  ld_script_path: stagprog.ld
  asm_path: asm/stagprog
  asset_path: assets/stagprog
  symbol_addrs_path: [symbol_addrs.txt]
  undefined_funcs_auto_path: build/stagprog_undefined_funcs_auto.txt
  undefined_syms_auto_path: build/stagprog_undefined_syms_auto.txt
  # Header (rodata) must come before code, as on disc.
  section_order: [".rodata", ".text", ".data", ".bss"]
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  subalign: 2
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: ovl15
    type: code
    start: 0x0
    vram: 0x800f2c50
    exclusive_ram_id: stage_slot
    symbol_name_format: "$VRAM_$SEG"
    subsegments:
      - [0x0, rodata, ovl15_header]   # overlay id + entry table
      - [0x20, asm, ovl15]
      - [0x211c, data, ovl15_data]
