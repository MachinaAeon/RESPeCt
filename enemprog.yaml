name: ENEMPROG.BIN
sha1: 87a288413c7efe76e31867eb47ee0350d30e0825
options:
  basename: enemprog
  target_path: disc/ENEMPROG.BIN
  elf_path: build/enemprog.elf
  base_path: .
  platform: psx
  compiler: PSYQ
  # Overlays reach KERNEL's globals through its $gp. Without this the
  # linker invents a GOT and the output grows by 8 bytes.
  gp_value: 0x80062D1C
  ld_script_path: enemprog.ld
  asm_path: asm/enemprog
  asset_path: assets/enemprog
  symbol_addrs_path: [symbol_addrs.txt]
  undefined_funcs_auto_path: build/enemprog_undefined_funcs_auto.txt
  undefined_syms_auto_path: build/enemprog_undefined_syms_auto.txt
  # Header (rodata) must come before code, as on disc.
  section_order: [".rodata", ".text", ".data", ".bss"]
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  subalign: 2
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
