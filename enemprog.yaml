    type: code
    start: 0x0
    vram: 0x800f8000
    exclusive_ram_id: enemy_slot_a
    symbol_name_format: "$VRAM_$SEG"
    subsegments:
      - [0x0, rodata, ovl34_header]   # overlay id + entry table
      - [0xd0, asm, ovl34]
